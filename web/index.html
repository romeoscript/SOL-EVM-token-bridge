<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Bridge tokens between Solana and Sepolia using Wormhole">
    <title>Wormhole Bridge | Solana ⟷ Sepolia</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">

    <!-- Favicon -->
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌉</text></svg>">
</head>

<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="logo">
                <span class="logo-icon">🌉</span>
                <span class="logo-text">Wormhole Bridge</span>
            </div>
        </header>

        <!-- Main Bridge Card -->
        <main class="bridge-main">
            <div class="bridge-card">
                <h2 class="bridge-title">Bridge</h2>

                <!-- From Section -->
                <div class="transfer-section">
                    <div class="section-header">
                        <span class="section-label">From</span>
                    </div>

                    <div class="chain-row">
                        <div class="chain-select">
                            <div class="chain-icon solana-icon">◎</div>
                            <div class="chain-info">
                                <div class="chain-name">Solana</div>
                            </div>
                            <svg class="dropdown-icon" width="12" height="12" viewBox="0 0 12 12" fill="none">
                                <path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" stroke-width="1.5"
                                    stroke-linecap="round" />
                            </svg>
                        </div>
                        <button class="connect-btn" id="connect-solana-btn">
                            <span id="solana-btn-text">Connect Sol</span>
                        </button>
                    </div>

                    <div class="amount-row">
                        <div class="token-select" id="from-token-select">
                            <div class="token-icon" id="from-token-icon">💵</div>
                            <span class="token-symbol" id="from-token-symbol">USDC</span>
                            <svg class="dropdown-icon" width="12" height="12" viewBox="0 0 12 12" fill="none">
                                <path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" stroke-width="1.5"
                                    stroke-linecap="round" />
                            </svg>

                            <!-- Token Dropdown -->
                            <div class="token-dropdown hidden" id="token-dropdown">
                                <div class="token-dropdown-item selected" data-token="USDC">
                                    <div class="token-icon">💵</div>
                                    <div class="token-info">
                                        <div class="token-name">USDC</div>
                                        <div class="token-full-name">USD Coin</div>
                                    </div>
                                </div>
                                <div class="token-dropdown-item" data-token="WSOL">
                                    <div class="token-icon">◎</div>
                                    <div class="token-info">
                                        <div class="token-name">WSOL</div>
                                        <div class="token-full-name">Wrapped SOL</div>
                                    </div>
                                </div>
                                <div class="token-dropdown-item" data-token="USDT">
                                    <div class="token-icon">💲</div>
                                    <div class="token-info">
                                        <div class="token-name">USDT</div>
                                        <div class="token-full-name">Tether USD</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <input type="number" class="amount-input" id="amount-input" placeholder="0.0000" step="0.01">
                    </div>

                    <div class="balance-row">
                        <span class="balance-label">Balance: <span id="from-balance">--</span></span>
                    </div>
                </div>

                <!-- Swap Arrow -->
                <div class="swap-arrow-container">
                    <button class="swap-arrow-btn" id="swap-btn">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                            <path d="M8 2V14M8 14L4 10M8 14L12 10" stroke="currentColor" stroke-width="1.5"
                                stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </button>
                </div>

                <!-- To Section -->
                <div class="transfer-section">
                    <div class="section-header">
                        <span class="section-label">To</span>
                    </div>

                    <div class="chain-row">
                        <div class="chain-select">
                            <div class="chain-icon eth-icon">⟠</div>
                            <div class="chain-info">
                                <div class="chain-name">Sepolia</div>
                            </div>
                            <svg class="dropdown-icon" width="12" height="12" viewBox="0 0 12 12" fill="none">
                                <path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" stroke-width="1.5"
                                    stroke-linecap="round" />
                            </svg>
                        </div>
                        <button class="connect-btn" id="connect-evm-btn">
                            <span id="evm-btn-text">Connect EVM</span>
                        </button>
                    </div>

                    <div class="amount-row">
                        <div class="token-select" id="to-token-select">
                            <div class="token-icon" id="to-token-icon">💵</div>
                            <span class="token-symbol" id="to-token-symbol">USDC</span>
                            <svg class="dropdown-icon" width="12" height="12" viewBox="0 0 12 12" fill="none">
                                <path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" stroke-width="1.5"
                                    stroke-linecap="round" />
                            </svg>
                        </div>
                        <div class="amount-display" id="receive-amount">0.0000</div>
                    </div>

                    <div class="balance-row">
                        <span class="balance-label">Balance: <span id="to-balance">--</span></span>
                    </div>
                </div>

                <!-- Bridge Button -->
                <button class="bridge-btn" id="bridge-btn" disabled>
                    <span id="bridge-btn-text">Connect Wallet</span>
                </button>

                <!-- Transaction Status (Hidden by default) -->
                <div class="tx-status hidden" id="tx-status">
                    <div class="status-header">
                        <span class="status-title">Transaction Status</span>
                        <span class="status-badge" id="status-badge">Pending</span>
                    </div>
                    <div class="status-steps" id="status-steps"></div>
                </div>
            </div>

            <!-- Info Cards -->
            <div class="info-cards">
                <div class="info-card">
                    <div class="info-icon">ℹ️</div>
                    <div class="info-content">
                        <div class="info-title">Need testnet tokens?</div>
                        <div class="info-links">
                            <a href="https://faucet.circle.com/" target="_blank">USDC Faucet</a>
                            <span>•</span>
                            <a href="https://sepoliafaucet.com/" target="_blank">Sepolia ETH</a>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="app-footer">
            <div class="footer-links">
                <a href="https://docs.wormhole.com/" target="_blank">Documentation</a>
                <a href="https://wormhole.com/" target="_blank">Wormhole</a>
                <a href="https://github.com/wormhole-foundation/wormhole" target="_blank">GitHub</a>
            </div>
        </footer>
    </div>

    <!-- Scripts -->
    <script type="module" src="config.js"></script>
    <script type="module" src="wallets.js"></script>
    <script type="module" src="bridge.js"></script>
    <script type="module" src="app.js"></script>
</body>

</html>
